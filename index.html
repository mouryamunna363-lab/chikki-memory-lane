<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Memory Lane</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
text-align:center;
background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
color:#333;
overflow:hidden;
}

.container{
padding:100px 20px;
}

input{
padding:10px;
font-size:16px;
border-radius:10px;
border:none;
}

button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:20px;
background:white;
cursor:pointer;
margin-left:10px;
}

.slideshow{
display:none;
padding-top:60px;
}

.photo-frame{
width:340px;
height:420px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.photo-frame img{
max-width:100%;
max-height:100%;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
opacity:0;
transition:opacity 1.2s ease;
}

.message{
margin-top:20px;
font-size:20px;
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.letter{
display:none;
max-width:650px;
margin:60px auto;
font-size:20px;
line-height:1.8;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.flower{
position:absolute;
top:-50px;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container" id="lockscreen">

<h2>🔐 Guess the password</h2>
<p>Hint: The nickname I saved you as.</p>

<input id="password" type="text">
<button onclick="checkPassword()">Unlock</button>

<p id="error"></p>

</div>


<div class="slideshow" id="memoryLane">

<h1>Welcome Chikki 🌸</h1>

<div class="photo-frame">
<img id="photo" src="photo1.jpg">
</div>

<div class="message" id="text"></div>

</div>


<div class="letter" id="letterBox">
<p id="letterText"></p>
</div>


<audio id="music" preload="auto" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>


<script>

let correctPassword="chikki";

function checkPassword(){

let input=document.getElementById("password").value.toLowerCase();

if(input===correctPassword){

document.getElementById("lockscreen").style.display="none";
document.getElementById("memoryLane").style.display="block";

let music=document.getElementById("music");

setTimeout(()=>{
music.volume=0.7;
music.play().catch(()=>{});
},200);

startSlideshow();
startFlowers();

}else{

document.getElementById("error").innerHTML="Try again 🙂";

}

}


let photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg",
"photo6.jpg",
"photo7.jpg",
"photo8.jpg",
"photo9.jpg",
"photo10.jpg",
"photo11.jpg"
];


let messages=[

"Some days look easy from the outside view,",
"But I know the effort it takes from you.",

"The quiet work you carry each day along the way,",
"And the patience you show without much to say.",

"You keep moving forward through moments tough and new,",
"Still finding your strength in all that you do.",

"And somehow your smile still finds its place,",
"Bringing warmth and calm into every space.",

"And seeing that strength quietly shine through,",
"Reminds me how strong I see you.",

"And it leaves a simple thought that's true,",
"That the world feels brighter just knowing you."

];


photos.forEach(src=>{
let img=new Image();
img.src=src;
});


let i=0;

function startSlideshow(){

let photo=document.getElementById("photo");
photo.style.opacity=1;

let slide=setInterval(function(){

if(i < photos.length){

photo.style.opacity=0;

setTimeout(function(){

photo.src=photos[i];
document.getElementById("text").innerHTML = messages[i] || "";

photo.style.opacity=1;

},200);

i++;

}else{

clearInterval(slide);
setTimeout(showLetter,1500);

}

},3500);

}


function showLetter(){

document.getElementById("memoryLane").style.display="none";
document.getElementById("letterBox").style.display="block";

let letter=`For Chikki

People often say women are strong every day,
But sometimes those words quietly drift away.

What they don't see are the things that you do,
The effort and patience that carry you through.

The long days you face and still keep bright,
The calm you hold even when things aren't light.

And seeing that strength has shown me too,
How much quiet courage lives in you.

You bring a warmth I didn't expect to find,
And a kind of happiness that stays in my mind.

So whatever tomorrow decides to do,
Just know I will always be here for you.

Happy Women's Day.
`;

typeLetter(letter);

}


function typeLetter(text){

let i=0;
let target=document.getElementById("letterText");

function typing(){

if(i<text.length){

let char=text.charAt(i);

if(char=="\n"){
target.innerHTML+="<br>";
}else{
target.innerHTML+=char;
}

i++;
setTimeout(typing,30);

}

}

typing();

}


function startFlowers(){

setInterval(function(){

let flower=document.createElement("div");

flower.classList.add("flower");
flower.innerHTML="🌸";

flower.style.left=Math.random()*100+"vw";
flower.style.animationDuration=(Math.random()*4+5)+"s";

document.body.appendChild(flower);

setTimeout(()=>flower.remove(),7000);

},800);

}

</script>

</body>
</html>
