<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Memory Lane</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
text-align:center;
background:linear-gradient(135deg,#ff9ecf,#ffd6e8);
overflow:hidden;
color:#333;
}

.container{
padding:100px 20px;
}

input{
padding:10px;
font-size:16px;
border-radius:10px;
border:none;
}

button{
padding:10px 20px;
font-size:16px;
border:none;
border-radius:20px;
background:white;
cursor:pointer;
margin-left:10px;
}

.slideshow{
display:none;
padding-top:60px;
}

img{
width:320px;
height:420px;
object-fit:cover;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
opacity:0;
transition:opacity 1.2s ease;
}
.message{
margin-top:20px;
font-size:20px;
}

.letter{
display:none;
max-width:650px;
margin:60px auto;
font-size:20px;
line-height:1.8;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:left;
}

.flower{
position:absolute;
top:-50px;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container" id="lockscreen">

<h2>🔐 Guess the password</h2>
<p>Hint: The nickname I saved you as.</p>

<input id="password" type="text" placeholder="Enter password">
<button onclick="checkPassword()">Unlock</button>

<p id="error"></p>

</div>


<div class="slideshow" id="memoryLane">

<h1>Welcome Chikki 🌸</h1>

<img id="photo" src="photo1.jpg">

<div class="message" id="text"></div>

</div>


<div class="letter" id="letterBox">
<p id="letterText"></p>
</div>


<audio id="music" src="music.mp3" preload="auto"></audio>


<script>

let correctPassword="chikki";

function checkPassword(){

let input=document.getElementById("password").value.toLowerCase();

if(input===correctPassword){

document.getElementById("lockscreen").style.display="none";
document.getElementById("memoryLane").style.display="block";

let music=document.getElementById("music");

music.volume = 0.7;

document.body.addEventListener("click", () => {
music.play();
}, { once: true });

startSlideshow();
startFlowers();

}
else{

document.getElementById("error").innerHTML="Hmm… try again 🙂";

}

}


let photos=[
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg",
"photo6.jpg",
"photo7.jpg",
"photo8.jpg",
"photo9.jpg",
"photo10.jpg",
"photo11.jpg",
"photo12.jpg"
];

let messages=[
"A small memory.",
"Another moment worth keeping.",
"Some smiles stay longer.",
"A day I still remember.",
"A simple moment.",
"Some laughs echo longer.",
"Moments like this matter.",
"A warm memory.",
"A quiet moment.",
"A little happiness.",
"A memory worth saving.",
"One more moment."
];


photos.forEach(src=>{
let img=new Image();
img.src=src;
});


let i=0;

function startSlideshow(){

let photo=document.getElementById("photo");

photo.style.opacity=1;

let slide=setInterval(function(){

if(i < photos.length){

photo.style.opacity=0;

setTimeout(function(){

photo.src=photos[i];
document.getElementById("text").innerHTML = messages[i] || "";

photo.style.opacity=1;

},200);

i++;

}
else{

clearInterval(slide);

setTimeout(showLetter,1500);

}

},3500);

}


function showLetter(){

document.getElementById("memoryLane").style.display="none";
document.getElementById("letterBox").style.display="block";

let letter=`For Chikki

Some days may look simple to people passing through,
But I know the effort it takes from you.

The way you carry your work and your care,
Still finding the patience and kindness to share.

You don’t always say when the days feel tight,
Yet you still move forward and hold things right.

And seeing that strength has shown me too,
How much quiet courage lives in you.

Somehow your smile turns heavy days light,
And knowing you makes my own world bright.

You give me a strength I didn’t expect to find,
And a calm kind of happiness that stays in my mind.

So whatever tomorrow may bring into view,
Just know I will always be here for you.

Happy Women's Day.`;

typeLetter(letter);

}


function typeLetter(text){

let i=0;
let target=document.getElementById("letterText");

function typing(){

if(i<text.length){

let char=text.charAt(i);

if(char=="\n"){
target.innerHTML+="<br>";
}
else{
target.innerHTML+=char;
}

i++;

setTimeout(typing,30);

}

}

typing();

}


function startFlowers(){

setInterval(function(){

let flower=document.createElement("div");

flower.classList.add("flower");

flower.innerHTML="🌸";

flower.style.left=Math.random()*100+"vw";
flower.style.animationDuration=(Math.random()*4+5)+"s";

document.body.appendChild(flower);

setTimeout(()=>{

flower.remove();

},7000);

},800);

}

</script>

</body>
</html>
